[project]
name = "ai-delivery-planner-backend"
version = "0.1.0"
description = "AI Delivery Planner — backend (FastAPI, OR-Tools, OpenAI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic[email]",
    "pydantic-settings",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt<4.0",
    "celery",
    "redis",
    "openai",
    "ortools",
    "httpx",
    "python-multipart",
    "openpyxl",
    "pandas",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff==0.15.22",
    "aiosqlite",
]
# Real IBM hardware + local IBM emulator for territory planning. Without it
# only the built-in NumPy statevector simulator (and classical) solvers run.
quantum = [
    "qiskit>=2.1",
    "qiskit-aer>=0.17",
    "qiskit-ibm-runtime>=0.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
