app = "ai-delivery-planner-backend"
primary_region = "fra"

[build]

[deploy]
  release_command = "alembic upgrade head"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"
  FRONTEND_BASE_URL = "https://ai-planning-assistant.vercel.app"
  CORS_ORIGINS = '["https://ai-planning-assistant.vercel.app"]'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
